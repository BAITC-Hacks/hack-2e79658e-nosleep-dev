<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Akim na 5 chasov — AI gorodskoi simulyator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#182544"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="56" y="108" fill="#f8fafc" font-size="46" font-weight="700" letter-spacing="0.2">Аким на 5 часов</text>
    <text x="56" y="140" fill="#94a3b8" font-size="18" letter-spacing="0.3">AI-симулятор городского бюджета · Astana Quality of Life Score</text>

    <g transform="translate(56,168)">
      <rect width="286" height="40" rx="20" fill="#0f172a" stroke="#334155"/>
      <rect x="4" y="4" width="278" height="32" rx="16" fill="url(#chip)" opacity="0.18"/>
      <text x="20" y="26" fill="#e2e8f0" font-size="16" font-weight="600">Score: 52.56</text>
      <text x="128" y="26" fill="#64748b" font-size="16">&#8594;</text>
      <text x="150" y="26" fill="#4ade80" font-size="16" font-weight="700">56.54</text>
      <text x="212" y="26" fill="#64748b" font-size="13">(+3.99)</text>
    </g>

    <text x="56" y="244" fill="#64748b" font-size="14">5 районов · 14 мероприятий · 5 решений · бюджет 100 у.е.</text>
    <text x="56" y="270" fill="#475569" font-size="13">Go + Gin · Next.js · NVIDIA NIM · DEMO_MODE</text>
  </g>

  <!-- schematic districts, not a real map: 5 blocks colored by district score, low to high -->
  <g font-family="Helvetica, Arial, sans-serif" transform="translate(780,42)">
    <g transform="translate(0,0)">
      <rect width="150" height="70" rx="10" fill="#22c55e"/>
      <text x="75" y="42" text-anchor="middle" fill="#052e16" font-size="15" font-weight="700">Есиль</text>
    </g>
    <g transform="translate(0,86)">
      <rect width="72" height="60" rx="10" fill="#84cc16"/>
      <text x="36" y="35" text-anchor="middle" fill="#1a2e05" font-size="12" font-weight="700">Алматы</text>
    </g>
    <g transform="translate(78,86)">
      <rect width="72" height="60" rx="10" fill="#a3e635"/>
      <text x="36" y="35" text-anchor="middle" fill="#1a2e05" font-size="11" font-weight="700">Сарыарка</text>
    </g>
    <g transform="translate(0,152)">
      <rect width="150" height="56" rx="10" fill="#84cc16"/>
      <text x="75" y="33" text-anchor="middle" fill="#1a2e05" font-size="13" font-weight="700">Байконур</text>
    </g>
    <g transform="translate(0,214)">
      <rect width="150" height="56" rx="10" fill="#ef4444">
        <animate attributeName="fill" values="#ef4444;#f59e0b;#ef4444" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="75" y="33" text-anchor="middle" fill="#450a0a" font-size="13" font-weight="700">Нура</text>
    </g>
  </g>
</svg>
